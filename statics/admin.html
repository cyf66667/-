<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>鹿野养成计划 - 后台管理系统</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div id="app" class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-gray-800">🦌 鹿野养成计划 - 数据大盘</h1>

        <div class="grid grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-500">
                <h2 class="text-gray-500 text-sm">总注册用户</h2>
                <p class="text-3xl font-bold">{{ summary.total_users || 0 }} 人</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-green-500">
                <h2 class="text-gray-500 text-sm">当前在线</h2>
                <p class="text-3xl font-bold text-green-600">{{ summary.current_online || 0 }} 人</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-purple-500">
                <h2 class="text-gray-500 text-sm">今日日期</h2>
                <p class="text-2xl font-bold mt-1">{{ summary.date || '加载中...' }}</p>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <table class="min-w-full text-left">
                <thead class="bg-gray-50 text-gray-700">
                    <tr>
                        <th class="px-6 py-4 font-medium">用户 ID</th>
                        <th class="px-6 py-4 font-medium">昵称</th>
                        <th class="px-6 py-4 font-medium">状态</th>
                        <th class="px-6 py-4 font-medium">最后登录时间</th>
                        <th class="px-6 py-4 font-medium">今日互动次数</th>
                        <th class="px-6 py-4 font-medium">今日在线时长</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr v-for="user in users" :key="user.user_id" class="hover:bg-gray-50">
                        <td class="px-6 py-4">#{{ user.user_id }}</td>
                        <td class="px-6 py-4 font-semibold">{{ user.nickname }}</td>
                        <td class="px-6 py-4">
                            <span v-if="user.is_online" class="px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs">在线</span>
                            <span v-else class="px-2 py-1 bg-gray-100 text-gray-600 rounded-full text-xs">离线</span>
                        </td>
                        <td class="px-6 py-4 text-gray-500">{{ user.last_login }}</td>
                        <td class="px-6 py-4">{{ user.today_actions }} 次</td>
                        <td class="px-6 py-4">{{ user.play_time_mins }} 分钟</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const summary = ref({});
                const users = ref([]);

                // 从 FastAPI 获取数据
                const fetchData = async () => {
                    try {
                        // 替换为你的服务器 IP 或域名，本地测试用 127.0.0.1
                        const response = await fetch('http://127.0.0.1:8000/admin/users_stats');
                        const data = await response.json();
                        summary.value = data.summary;
                        users.value = data.users;
                    } catch (error) {
                        console.error('获取数据失败:', error);
                        alert('无法连接到后端接口，请检查 FastAPI 是否运行。');
                    }
                };

                // 页面加载时请求数据
                onMounted(() => {
                    fetchData();
                    // 可以设置每 30 秒自动刷新一次数据
                    setInterval(fetchData, 30000); 
                });

                return { summary, users }
            }
        }).mount('#app')
    </script>
</body>
</html>
