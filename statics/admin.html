<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>鹿野养成计划 - 数据大盘</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f5f7; padding: 20px; color: #333; }
        h2 { margin-bottom: 20px; }
        .cards { display: flex; gap: 20px; margin-bottom: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 8px; flex: 1; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 5px solid #007bff; }
        .card.green { border-left-color: #28a745; }
        .card.purple { border-left-color: #6f42c1; }
        .card-title { font-size: 14px; color: #666; margin-bottom: 10px; }
        .card-value { font-size: 28px; font-weight: bold; }
        table { width: 100%; background: #fff; border-collapse: collapse; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #fafafa; color: #666; font-weight: 600; }
        tr:hover { background-color: #f9f9f9; }
    </style>
</head>
<body>
    <h2>🦌 鹿野养成计划 - 实时数据大盘</h2>
    <div class="cards">
        <div class="card">
            <div class="card-title">总注册用户</div>
            <div class="card-value" id="total-users">0 人</div>
        </div>
        <div class="card green">
            <div class="card-title">今日互动活跃</div>
            <div class="card-value" id="online-users">0 人</div>
        </div>
        <div class="card purple">
            <div class="card-title">今日日期</div>
            <div class="card-value" id="today-date">加载中...</div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>用户 ID</th>
                <th>昵称</th>
                <th>鹿野状态</th>
                <th>最后操作时间</th>
                <th>今日互动次数</th>
                <th>饥饿 / 口渴值</th>
            </tr>
        </thead>
        <tbody id="user-table-body">
            </tbody>
    </table>

    <script>
        // 设置今日日期
        const dateStr = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
        document.getElementById('today-date').innerText = dateStr;

        // 向后端 API 拉取数据并渲染
        async function fetchDashboardData() {
            try {
                const response = await fetch('/api/dashboard');
                const data = await response.json();

                // 更新顶部卡片
                document.getElementById('total-users').innerText = data.total_users + ' 人';
                document.getElementById('online-users').innerText = data.active_users + ' 人';

                // 更新表格
                const tbody = document.getElementById('user-table-body');
                tbody.innerHTML = ''; // 清空旧数据

                data.users.forEach(user => {
                    // 智能判断鹿野状态
                    let status = "🟢 状态良好";
                    if (user.hunger > 70 || user.thirst > 70) status = "🔴 极度饥渴";
                    else if (user.hunger > 40 || user.thirst > 40) status = "🟡 需要照顾";

                    const row = `
                        <tr>
                            <td># ${user.user_id}</td>
                            <td>${user.nickname}</td>
                            <td>${status}</td>
                            <td>${user.last_updated || '<span style="color:#ccc;">暂无操作</span>'}</td>
                            <td>${user.actions_today} 次</td>
                            <td>🍔 ${user.hunger} / 💧 ${user.thirst}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                console.error("数据拉取失败:", error);
            }
        }

        // 立即拉取一次，然后每 3 秒钟自动刷新一次数据！
        fetchDashboardData();
        setInterval(fetchDashboardData, 3000);
    </script>
</body>
</html>
